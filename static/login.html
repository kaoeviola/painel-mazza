<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Mazza Broker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-label="Login">
      <div class="brand-block">
        <span class="brand-mark">MB</span>
        <div>
          <p class="eyebrow">Mazza Broker</p>
          <h1>Entrar no painel</h1>
        </div>
      </div>

      {% if erro %}
      <p class="alert" role="alert">{{ erro }}</p>
      {% endif %}

      <form method="post" action="/login" class="form-stack">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>
